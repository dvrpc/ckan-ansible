---
# This playbook to be run after playbook_init has been run once, and then can be run on its
# own anytime changes need to be made.
- hosts: ckan
  become: true

  vars:
    ckan_dir: "/usr/lib/ckan/default"
    ckan_ini_dir: "/etc/ckan/default"
    ckan_ini_path: "{{ckan_ini_dir}}/ckan.ini"
    solr_ckan_core_conf_dir: "/var/solr/data/ckan/conf"
    solr_ckan_core_custom_schema: "{{ solr_ckan_core_conf_dir }}/managed-schema.xml"
    solr_download_dir: "/usr/local/solr"
    solr_archive: solr-9.11.0.tgz

  handlers:
    - name: reload nginx
      service:
        name: nginx
        state: reloaded
        enabled: true

    - name: restart solr
      service:
        name: solr
        state: restarted
        enabled: true

    - name: rebuild solr index
      command: "{{ ckan_dir }}/bin/ckan -c {{ ckan_ini_path }} search-index rebuild"
      ignore_errors: true

    - name: reload ckan
      command: supervisorctl reload

    - name: generate js translations
      command:
        cmd: "{{ ckan_dir }}/bin/ckan -c {{ ckan_ini_path }} translation js"

  pre_tasks:
    - name: Update apt cache
      apt: update_cache=yes cache_valid_time=3600

    - name: Install packages required for ansible on the remote server
      block:

        - name: Install system packages
          apt:
            name:
              - python3-pip
              - python3-psycopg2
              - acl
              - unzip
            state: present

  roles:
    - role: users
      tags: users
    - role: hardening
      tags: hardening
    - role: base
      tags: base
    - role: dvrpc_theme
      tags: theme
    - scheming
    - pdfview
    - geoview
    - custom_privileges

  tasks:
    - name: Create/renew TLS certificate
      include_role:
        name: base
        tasks_from: tls_cert.yaml
      tags: tls
      when: env == "production"

    # - name: Set up oauth
    #   include_role:
    #     name: oauth


