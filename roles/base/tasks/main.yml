---
# tasks to install CKAN with only base plugins (datastore, filestore, datapusher)
- name: Install required system packages
  apt:
    name:
      - libpq5
      - redis-server
      - nginx
      - supervisor
      # these ones required for installation from source, but not package
      - python3-dev
      - libpq-dev
      - python3-pip
      - python3-venv
      - git-core
      - libmagic1
    state: present

- name: Install CKAN from source into virtual environment
  pip:
    name: git+https://github.com/ckan/ckan.git@ckan-2.12.0#egg=ckan[requirements]
    virtualenv: "{{ ckan_dir }}"
    virtualenv_command: "python3 -m venv"
  register: ckan_package

- name: Check if ckan.ini exists
  stat:
    path: "{{ ckan_ini_path }}"
  register: ini

- name: Make directory for CKAN ini
  file:
    path: "{{ ckan_ini_dir }}"
    state: directory

- name: Upload initial version of CKAN ini file, which will be modified by other tasks.
  template:
    src: ckan.ini.j2
    dest: "{{ ckan_ini_path }}"
  when: not ini.stat.exists

# This is what plugins (before datastore?) we previously started with
# - name: Update plugins in ckan.ini
