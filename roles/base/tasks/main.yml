---
# tasks to install CKAN with only base plugins (datastore, filestore, datapusher)
- name: Install required system packages
  apt:
    name:
      - libpq5
      - redis-server
      - nginx
      - supervisor
      # these ones required for installation from source, but not package
      - python3-dev
      - libpq-dev
      - python3-pip
      - python3-venv
      - git-core
      - libmagic1
      - postfix
    state: present

- name: Install CKAN from source into virtual environment
  pip:
    name: git+https://github.com/ckan/ckan.git@ckan-2.12.0#egg=ckan[requirements]
    virtualenv: "{{ ckan_dir }}"
    virtualenv_command: "python3 -m venv"
  register: ckan_package

- name: Install further dependencies
  pip:
    name: ckanapi
    virtualenv: "{{ ckan_dir }}"

- name: Check if ckan.ini exists
  stat:
    path: "{{ ckan_ini_path }}"
  register: ini

- name: Make directory for CKAN ini
  file:
    path: "{{ ckan_ini_dir }}"
    state: directory

- name: Upload initial version of CKAN ini file, which will be modified by other tasks.
  template:
    src: ckan.ini.j2
    dest: "{{ ckan_ini_path }}"
  when: not ini.stat.exists

- name: Update site_url in ckan ini
  ini_file:
    path: "{{ ckan_ini_path }}"
    section: app:main
    option: ckan.site_url
    # TODO: check if a better way to do this is used in cloud-ansible (scheme?)
    value: "http{% if use_tls %}s{% endif %}://{{ domain }}"

# This is what plugins (before datastore?) we previously started with
# - name: Update plugins in ckan.ini
#   ini_file:
#     path: "{{ ckan_ini_path }}"
#     section: app:main
#     option: ckan.plugins
#     value: stats datatables_view image_view datapusher resource_proxy
#   notify: reload ckan
- name: Install and configure postgres
  block:
    - name: Install postgres
      apt:
        name: postgresql
        state: present

    - name: Create db user
      become: true
      become_user: postgres
      postgresql_user:
        name: ckan_default
        password: "{{ ckan_default_db_pass }}"

    - name: Create db
      become: true
      become_user: postgres
      postgresql_db:
        db: ckan_default
        owner: ckan_default

    - name: Grant privileges
      become: true
      become_user: postgres
      postgresql_privs:
        login_db: ckan_default
        roles: ckan_default
        type: database
        priv: "ALL"

    - name: Update ckan.ini file to include connection string
      ini_file:
        path: "{{ ckan_ini_path }}"
        section: app:main
        option: sqlalchemy.url
        value: "postgresql://ckan_default:{{ ckan_default_db_pass }}@localhost/ckan_default"


# <https://docs.ckan.org/en/2.12/maintaining/installing/install-from-source.html#setup-solr>
# <https://solr.apache.org/guide/solr/9_11/deployment-guide/installing-solr.html>
- name: Install and configure solr
  block:
    - name: Install solr dependencies
      apt:
        name: openjdk-11-jdk
        state: present

    - name: Create directory to hold downloaded solr binary release
      file:
        path: "{{ solr_download_dir }}"
        state: directory
        mode: 0755

    # TODO: come back to this and make it check for executable; for now I'm just checking if
    # download exists so I don't repeatedly download it. Then, make additional tasks below
    # skipped if register var already set.
    - name: Check if solr binary release already downloaded.
      stat:
        path: "{{ solr_download_dir }}/{{solr_archive}}"
      register: st

    - name: Download solr binary release.
      get_url:
        url: "https://www.apache.org/dyn/closer.lua/solr/solr/9.11.0/{{ solr_archive }}?action=download"
        dest: "{{ solr_download_dir }}"
      when: not st.stat.exists

    - name: Check if solr already installed.
      stat:
        path: "/opt/solr/bin/solr"
      register: solr

    - name: Extract install script
      command:
        cmd: "tar xzf {{ solr_archive }} solr-9.11.0/bin/install_solr_service.sh --strip-components=2"
        chdir: "{{ solr_download_dir }}"
      when: not solr.stat.exists

    # The script installs it into /opt/solr, but that specific directory is used as option here
    # in case default behavior changes in future.
    # Note that this installs into directory that includes version (e.g. /opt/solr-9.11.0/) but
    # then symlinks /opt/solr to it.
    - name: Run install script from solr download directory
      command:
        cmd: "bash ./install_solr_service.sh {{ solr_archive }} -i /opt/ -f"
        chdir: "{{ solr_download_dir }}"
      when: not solr.stat.exists

    - name: Update CKAN ini file for solr setting
      ini_file:
        path: "{{ ckan_ini_path }}"
        section: app:main
        option: solr_url
        value: http://localhost:8983 # without /solr, as suggested by output of `/opt/solr/bin/solr status`
      notify: restart solr

  notify: restart solr

# solr needs to be reloaded here before next set of tasks.
- name: Flush handlers
  meta: flush_handlers

# the directory where solr's ckan "collection/core" is gets created by `solr create`. Check
# if already created (I haven't yet found a better way to check if the collection has
# already been created)
- name: Create var on whether collection/core dirs created
  stat:
    path: "{{ solr_ckan_core_custom_schema }}"
  register: solr_collection_dirs

# NOTE: this has to happen after solr running
- name: Create collection for ckan
  command: /opt/solr/bin/solr create -c ckan
  become: true
  become_user: solr
  when: not solr_collection_dirs.stat.exists

- name: Download custom solr schema
  get_url:
    url: https://raw.githubusercontent.com/ckan/ckan/ckan-2.12.0/ckan/config/solr/schema.xml
    dest: "{{ solr_ckan_core_custom_schema }}"
    owner: solr
    group: solr
  when: not solr_collection_dirs.stat.exists
  notify: restart solr

- name: Register var to check if db tables already created
  postgresql_query:
    db: ckan_default
    login_user: ckan_default
    login_password: "{{ ckan_default_db_pass }}"
    login_host: localhost
    query: "SELECT EXISTS ( SELECT 1 FROM pg_tables WHERE schemaname = 'public' AND tablename = 'user');"
  register: tables_created

- name: Initialize database
  command: "{{ckan_dir}}/bin/ckan -c {{ ckan_ini_path }} db init"
  when: not tables_created.query_result.0.exists

- name: Create sysadmin
  block:
    - name: Register output of user list command
      command: "{{ ckan_dir }}/bin/ckan -c {{ ckan_ini_path }} user list"
      register: user_list
      changed_when: false

    - name: Register output of sysadmin list command
      command: "{{ ckan_dir }}/bin/ckan -c {{ ckan_ini_path }} sysadmin list"
      register: sysadmin_list
      changed_when: false

    - name: Create user
      expect:
        command: "{{ ckan_dir }}/bin/ckan -c {{ ckan_ini_path }} user add {{ sysadmin }} email={{ sysadmin_email }} name={{ sysadmin }}"
        responses:
          "Password ": "{{ sysadmin_pass }}"
          "Repeat for confirmation": "{{ sysadmin_pass }}"
      when: sysadmin not in user_list.stdout

    - name: Make that user a sysadmin
      command: "{{ ckan_dir }}/bin/ckan -c {{ ckan_ini_path }} sysadmin add {{ sysadmin }}"
      when: sysadmin not in sysadmin_list.stdout
  notify: reload ckan


- name: Install Datastore plugin
  block:
    - name: Create database
      postgresql_db:
        name: datastore_default
        owner: ckan_default
      become_user: postgres
      register: datastore_database

    - name: Create database user
      postgresql_user:
        name: datastore_default
        password: "{{ datastore_default_db_pass }}"
        db: datastore_default
      become_user: postgres

    - name: Update ckan.ini
      ini_file:
        path: "{{ ckan_ini_path }}"
        section: app:main
        option: "{{ item.key }}"
        value: "{{ item.value }}"
      loop: "{{ ini_content | dict2items }}"
      vars:
        ini_content:
          ckan.datastore.write_url: "postgresql://ckan_default:{{ ckan_default_db_pass }}@localhost/datastore_default"
          ckan.datastore.read_url: "postgresql://datastore_default:{{ datastore_default_db_pass }}@localhost/datastore_default"
          ckan.datastore.sqlsearch.enabled: false
      notify: reload ckan

    - name: Add plugin to ckan.plugins setting if not already in it
      lineinfile:
        path: "{{ ckan_ini_path }}"
        backrefs: true
        regexp: "^(?!.* datastore)(ckan.plugins =.*)"
        line: '\1 datastore'
      notify: reload ckan

    - name: Create tables and set permissions
      shell: "{{ ckan_dir}}/bin/ckan -c {{ ckan_ini_path }} datastore set-permissions | sudo -u postgres psql --set ON_ERROR_STOP=1"
      when: datastore_database.changed
  notify: reload ckan

# - name: Install v0.6.0 of flask-login to fix compatibility issues
#   pip:
#     virtualenv: /usr/lib/ckan/datapusher
#     name: flask_login
#     version: 0.6.0

- name: Configure filestore
  block:
    - name: Create directory
      file:
        path: /var/lib/ckan/default
        state: directory
        mode: 0774

    - name: Add storage path to ckan ini
      ini_file:
        path: "{{ ckan_ini_path }}"
        section: app:main
        option: ckan.storage_path
        value: /var/lib/ckan/default
      notify: reload ckan

# NOTE: might still have to do additional work to migrate from data pusher, see
# <https://github.com/ckan/ckanext-xloader/tree/master#upgrading-from-datapusher>
# In particular, "freeze the column types (in the data dictionaries), so that XLoader doesn't
# change them back to string on next xload:"
- name: Install and configure XLoader (officially supported replacement of datapusher)
  block:

    - name: Install Xloader into CKAN virtual environment
      pip:
        name: ckanext-xloader
        virtualenv: /usr/lib/ckan/default

    - name: Install further dependencies
      pip:
        name: requests[security]
        virtualenv: "{{ ckan_dir }}"

    - name: Add plugin to ckan.plugins setting if not already in it
      lineinfile:
        path: "{{ ckan_ini_path }}"
        backrefs: true
        regexp: "^(?!.* xloader)(ckan.plugins =.*)"
        line: '\1 xloader'
      notify: reload ckan

    - name: Check if API token already made for Xloader
      command:
        cmd: "{{ ckan_dir }}/bin/ckan -c {{ ckan_ini_path }} user token list default"
      register: xloader_token

    - name: View register var
      debug:
        msg: "{{ xloader_token.stdout }}"

    - name: View register var
      debug:
        msg: "{{ xloader_token.stdout.find('xloader') }}"

    - name: Create token for Xloader
      shell: "{{ ckan_dir }}/bin/ckan config-tool {{ ckan_ini_path }} ckanext.xloader.api_token=$({{ ckan_dir }}/bin/ckan -c {{ ckan_ini_path }} user token add default xloader | tail -n 1 | tr -d '\t')"
      when: xloader_token.stdout.find("xloader") == -1

    - name: Update ckan.ini file to include connection string
      ini_file:
        path: "{{ ckan_ini_path }}"
        section: app:main
        option: ckanext.xloader.jobs_db.url
        value: "postgresql://ckan_default:{{ ckan_default_db_pass }}@localhost/ckan_default"
      notify: reload ckan

    - name: Update ckan.ini file to include formats to handle
      ini_file:
        path: "{{ ckan_ini_path }}"
        section: app:main
        option: ckanext.xloader.formats
        value: "csv xls xlsx tsv application/csv application/vnd.ms-excel application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
      notify: reload ckan


# - name: Define default resource views
#   ini_file:
#     path: "{{ ckan_ini_path }}"
#     section: app:main
#     option: ckan.views.default_views
#     value: image_view text_view datatables_view
#   notify: reload ckan

- name: Update ckan_default and datastore_default db permissions via script
  command: "{{ ckan_dir }}/bin/ckan -c {{ ckan_ini_path }} datastore set-permissions"
  when: ckan_package.changed
  notify:
    - reload nginx
    - reload ckan

- name: CORS - allow all origins
  ini_file:
    path: "{{ ckan_ini_path }}"
    section: app:main
    option: ckan.cors.origin_allow_all
    value: "true"
  notify: reload ckan

- name: Upload WSGI script
  copy:
    src: wsgi.py
    dest: "{{ ckan_ini_dir }}"
  notify: reload ckan

- name: Upload uwsgi config file
  copy:
    src: ckan-uwsgi.ini
    dest: "{{ ckan_ini_dir }}"
  notify: reload ckan

- name: Upload config file for supervisorctl/ckan-uwsgi
  copy:
    src: ckan-uwsgi.conf
    dest: "{{ ckan_ini_dir }}"

- name: Create uwsgi server
  pip:
    name: uwsgi
    virtualenv: "{{ ckan_dir }}"
  notify: reload ckan

# https://docs.ckan.org/en/2.9/maintaining/tracking.html
- name: Add page view tracking, including email notification
  block:
    - name: Add setting to ckan ini
      ini_file:
        path: "{{ ckan_ini_path }}"
        section: app:main
        option: ckan.tracking_enabled
        value: "true"
      notify: reload ckan

    - name: Create cronjob for tracking
      cron:
        name: "Update tracking summary data"
        minute: "0"
        hour: "4"
        job: "{{ckan_dir}}/bin/ckan -c {{ ckan_ini_path }} tracking update && {{ckan_dir}}/bin/ckan -c {{ ckan_ini_path }} search-index rebuild -r"
        user: root

    - name: Add script to get top 10 most viewed datasets
      copy:
        src: dataset_tracking_total.sh
        dest: ~/dataset_tracking_total.sh
        mode: 0755
      become: true
      become_user: postgres

    - name: Add script to get top 10 most recently viewed datasets
      copy:
        src: dataset_tracking_recent.sh
        dest: ~/dataset_tracking_recent.sh
        mode: 0755
      become: true
      become_user: postgres

    - name: Create cronjob for running dataset_track_total.sh
      cron:
        name: "Get top 10 most viewed datasets and email results"
        minute: "10"
        hour: "4"
        day: "15"
        job: ~/dataset_tracking_total.sh
        user: postgres
      become: true
      become_user: postgres

    - name: Create cronjob for running dataset_track_recent.sh
      cron:
        name: "Get top 10 most recently viewed datasets and email results"
        minute: "10"
        hour: "4"
        day: "15"
        job: ~/dataset_tracking_recent.sh
        user: postgres
      become: true
      become_user: postgres

- name: Change template permissions
  file:
    path: /usr/lib/ckan/default/src/ckan/ckan/public/base
    owner: www-data
    group: www-data
    recurse: yes
