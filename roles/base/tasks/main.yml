- name: Install and configure postgres
  block:
    - name: Install postgres
      apt:
        name: postgresql
        state: present

    - name: Create db user
      become: true
      become_user: postgres
      postgresql_user:
        name: ckan_default
        password: "{{ ckan_default_db_pass }}"

    - name: Create db
      become: true
      become_user: postgres
      postgresql_db:
        db: ckan_default
        owner: ckan_default

    - name: Grant privileges
      become: true
      become_user: postgres
      postgresql_privs:
        login_db: ckan_default
        roles: ckan_default
        type: database
        priv: "ALL"

    - name: Update ckan.ini file to include connection string
      ini_file:
        path: "{{ ckan_ini_path }}"
        section: app:main
        option: sqlalchemy.url
        value: "postgresql://ckan_default:{{ ckan_default_db_pass }}@localhost/ckan_default"
        backup: true

- name: Create sysadmin
  block:
    - name: Register output of user list command
      command: "{{ ckan_dir }}/bin/ckan -c /etc/ckan/default/ckan.ini user list"
      register: user_list
      changed_when: false

    - name: Register output of sysadmin list command
      command: "{{ ckan_dir }}/bin/ckan -c /etc/ckan/default/ckan.ini sysadmin list"
      register: sysadmin_list
      changed_when: false

    - name: Create user
      expect:
        command: "{{ ckan_dir }}/bin/ckan -c /etc/ckan/default/ckan.ini user add {{ sysadmin }} email={{ sysadmin_email }} name={{ sysadmin }}"
        responses:
          "Password ": "{{ sysadmin_pass }}"
          "Repeat for confirmation": "{{ sysadmin_pass }}"
      when: sysadmin not in user_list.stdout

    - name: Make that user a sysadmin
      command: "{{ ckan_dir }}/bin/ckan -c /etc/ckan/default/ckan.ini sysadmin add {{ sysadmin }}"
      when: sysadmin not in sysadmin_list.stdout
  notify: reload ckan

- name: Install and configure solr
  block:
    - name: Install solr
      apt:
        name: solr-tomcat
        state: present

    - name: Change port
      xml:
        path: /etc/tomcat9/server.xml
        xpath: /Server/Service[@name="Catalina"]/Connector
        value: "8983"
        attribute: port
        state: present

    - name: Register variable to check schema.xml file type
      stat:
        path: /etc/solr/conf/schema.xml
      register: default_schema

    - name: Backup default schema file if regular file (not symlink)
      command: mv /etc/solr/conf/schema.xml /etc/solr/conf/schema.xml.bak
      when: default_schema.stat.exists and default_schema.stat.isreg

    - name: Symlink to CKAN's schema file
      file:
        src: /usr/lib/ckan/default/src/ckan/ckan/config/solr/schema.xml
        dest: /etc/solr/conf/schema.xml
        state: link
        force: true

    # Docs use 127.0.0.1 but we actually want localhost so it can use IP6
    - name: Update CKAN ini file for solr setting
      ini_file:
        path: /etc/ckan/default/ckan.ini
        section: app:main
        option: solr_url
        value: http://localhost:8983/solr
        backup: true

    - name: Give group write permissions to /var/log/tomcat9 to avoid errors
      file:
        path: /var/log/tomcat9
        recurse: true
        mode: 0775
  notify: restart solr

- name: Update site_url in ckan ini
  ini_file:
    path: "{{ ckan_ini_path }}"
    section: app:main
    option: ckan.site_url
    value: "http{% if use_tls %}s{% endif %}://{{ domain }}"
    backup: true

- name: Register var to check if db tables already created
  postgresql_query:
    db: ckan_default
    login_user: ckan_default
    login_password: "{{ ckan_default_db_pass }}"
    login_host: localhost
    query: "SELECT EXISTS ( SELECT 1 FROM pg_tables WHERE schemaname = 'public' AND tablename = 'user');"
  register: tables_created

- name: Initialize database
  command: "{{ckan_dir}}/bin/ckan -c {{ ckan_ini_path }} db init"
  when: not tables_created.query_result.0.exists

- name: Install Datastore plugin
  block:
    - name: Create database
      postgresql_db:
        name: datastore_default
        owner: ckan_default
      become_user: postgres
      register: datastore_database

    - name: Create database user
      postgresql_user:
        name: datastore_default
        password: "{{ datastore_default_db_pass }}"
        db: datastore_default
      become_user: postgres

    - name: Update ckan.ini
      ini_file:
        path: "{{ ckan_ini_path }}"
        section: app:main
        option: "{{ item.key }}"
        value: "{{ item.value }}"
        backup: true
      loop: "{{ ini_content | dict2items }}"
      vars:
        ini_content:
          ckan.datastore.write_url: "postgresql://ckan_default:{{ ckan_default_db_pass }}@localhost/datastore_default"
          ckan.datastore.read_url: "postgresql://datastore_default:{{ datastore_default_db_pass }}@localhost/datastore_default"
          ckan.datastore.sqlsearch.enabled: false
      notify: reload ckan

    - name: Add plugin to ckan.plugins setting if not already in it
      lineinfile:
        path: "{{ ckan_ini_path }}"
        backrefs: true
        regexp: "^(?!.* datastore)(ckan.plugins =.*)"
        line: '\1 datastore'
      notify: reload ckan

    - name: Create tables and set permissions
      shell: "{{ ckan_dir}}/bin/ckan -c {{ ckan_ini_path }} datastore set-permissions | sudo -u postgres psql --set ON_ERROR_STOP=1"
      when: datastore_database.changed
  notify: reload ckan

# - name: Install v0.6.0 of flask-login to fix compatibility issues
#   pip:
#     virtualenv: /usr/lib/ckan/datapusher
#     name: flask_login
#     version: 0.6.0

- name: Configure filestore
  block:
    - name: Create directory
      file:
        path: /var/lib/ckan/default
        state: directory
        mode: 0774

    - name: Add storage path to ckan ini
      ini_file:
        path: "{{ ckan_ini_path }}"
        section: app:main
        option: ckan.storage_path
        value: /var/lib/ckan/default
        backup: true
      notify: reload ckan

# NOTE: might still have to do additional work to migrate from data pusher, see
# <ckanext.xloader.formats = csv application/csv xls application/vnd.ms-excel>
# In particular, "freeze the column types (in the data dictionaries), so that XLoader doesn't
# change them back to string on next xload:"
- name: Install and configure XLoader (officially supported replacement of datapusher)
  block:

    - name: Install Xloader into CKAN virtual environment
      pip:
        name: ckanext-xloader
        virtualenv: /usr/lib/ckan/default

    - name: Install further dependencies
      pip:
        name: requests[security]
        virtualenv: "{{ ckan_dir }}"

    - name: Add plugin to ckan.plugins setting if not already in it
      lineinfile:
        path: "{{ ckan_ini_path }}"
        backrefs: true
        regexp: "^(?!.* xloader)(ckan.plugins =.*)"
        line: '\1 xloader'
      notify: reload ckan

    - name: Check if API token already made for Xloader
      command:
        cmd: "{{ ckan_dir }}/bin/ckan -c {{ ckan_ini_path }} user token list default"
      register: xloader_token

    - name: View register var
      debug:
        msg: "{{ xloader_token.stdout }}"

    - name: View register var
      debug:
        msg: "{{ xloader_token.stdout.find('xloader') }}"

    - name: Create token for Xloader
      shell: "{{ ckan_dir }}/bin/ckan config-tool {{ ckan_ini_path }} ckanext.xloader.api_token=$({{ ckan_dir }}/bin/ckan -c {{ ckan_ini_path }} user token add default xloader | tail -n 1 | tr -d '\t')"
      when: xloader_token.stdout.find("xloader") == -1

    - name: Update ckan.ini file to include connection string
      ini_file:
        path: "{{ ckan_ini_path }}"
        section: app:main
        option: ckanext.xloader.jobs_db.url
        value: "postgresql://ckan_default:{{ ckan_default_db_pass }}@localhost/ckan_default"
        backup: true
      notify: reload ckan

    - name: Update ckan.ini file to include formats to handle
      ini_file:
        path: "{{ ckan_ini_path }}"
        section: app:main
        option: ckanext.xloader.formats
        value: "csv xls xlsx tsv application/csv application/vnd.ms-excel application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
        backup: true
      notify: reload ckan


