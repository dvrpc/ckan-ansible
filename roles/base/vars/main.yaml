---
ckan_default_db_backup: ckan_default-2026-10-23.pgc
datastore_default_db_backup: datastore_default-2026-11-02.pgc
filestore_backup: filestore-2026-10-26.tar.gz

# Change these on the command line - not here- when needed. They should always be 'false' here.
upgrade_ckan: false
upgrade_db: false

# postgresql settings
password_encryption: "scram-sha-256"
max_connections: 100
shared_buffers: 512MB
effective_cache_size: 1536MB
maintenance_work_mem: 128MB
checkpoint_completion_target: 0.9
wal_buffers: 16MB
default_statistics_target: 100
random_page_cost: 4
effective_io_concurrency: 2
work_mem: 4368kB
huge_pages: off
jit: off
# wal_compression: lz4
min_wal_size: 1GB
max_wal_size: 4GB
