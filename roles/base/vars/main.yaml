---
ckan_default_db_backup: ckan_default-2026-11-19.pgc
datastore_default_db_backup: datastore_default-2026-11-19.pgc
filestore_backup: filestore-2026-11-19.tar.gz

# Change these on the command line - not here- when needed. They should always be 'false' here.
upgrade_ckan: false
upgrade_db: false

# Postgres settings.
# https://pgtune.leopard.in.ua/ used to generate these, except encryption.
# DB Version: 16
# OS Type: Linux
# DB Type: Mixed type of application
# Total Memory (RAM): 4 GB
# CPUs num: 2
# Connections num: 100
# Data Storage: SSD storage
# Total Data Size: 1x - 3x RAM

password_encryption: "scram-sha-256"
max_connections: 100            # restart required
shared_buffers: 1GB             # restart required
effective_cache_size: 3GB
maintenance_work_mem: 256MB
wal_buffers: 16MB               # restart required
random_page_cost: 1.1
effective_io_concurrency: 200
maintenance_io_concurrency: 200
work_mem: 4MB
jit: off
wal_compression: lz4
vacuum_buffer_usage_limit: 2MB
min_wal_size: 1GB
max_wal_size: 4GB               # needs free disk space
