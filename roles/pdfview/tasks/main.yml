---
# tasks to install the ckanext-pdfview plugin
- name: Clone the plugin repo
  git:
    repo: https://github.com/ckan/ckanext-pdfview
    dest: /usr/lib/ckan/default/src/ckanext-pdfview/
  register: repo

- name: Install the plugin
  pip:
    name: /usr/lib/ckan/default/src/ckanext-pdfview/
    editable: true
    virtualenv: "{{ ckan_dir }}"
  when: repo.changed

- name: Add plugin to ckan.plugins setting if not already in it
  lineinfile:
    path: "{{ ckan_ini_path }}"
    backrefs: true
    regexp: "^(?!.* pdf_view)(ckan.plugins =.*)"
    line: '\1 pdf_view'
  notify: reload ckan

- name: Add to default resource views
  lineinfile:
    path: "{{ ckan_ini_path }}"
    backrefs: true
    regexp: "^(?!.* pdf_view)(ckan.views.default_views = .*)"
    line: '\1 pdf_view'
  notify: reload ckan
