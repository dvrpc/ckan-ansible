---
- name: Clone ckan_scheming plugin repo
  git:
    repo: https://github.com/ckan/ckanext-scheming/
    dest: /usr/lib/ckan/default/src/ckanext-scheming/
    version: master
  register: repo

- name: Install the plugin
  pip:
    name: /usr/lib/ckan/default/src/ckanext-scheming/
    editable: true
    virtualenv: "{{ ckan_dir }}"
  when: repo.changed

- name: Add plugin to ckan.plugins setting if not already in it
  lineinfile:
    path: "{{ ckan_ini_path }}"
    backrefs: true
    regexp: "^(?!.* scheming_datasets)(ckan.plugins =.*)"
    line: '\1 scheming_datasets'
  notify: reload ckan
