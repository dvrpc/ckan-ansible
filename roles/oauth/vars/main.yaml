# vars file for oauth ckan-oauth2 config
# Client_id and client_secret can be found at <https://console.cloud.google.com/apis/credentials>
authorization_endpoint: https://accounts.google.com/o/oauth2/v2/auth
token_endpoint: https://oauth2.googleapis.com/token
scope: openid https://www.googleapis.com/auth/userinfo.email https://www.googleapis.com/auth/userinfo.profile
profile_api_url: https://www.googleapis.com/oauth2/v2/userinfo
profile_api_user_field: email
profile_api_fullname_field: name
profile_api_mail_field: email
authorization_header: Authorization

